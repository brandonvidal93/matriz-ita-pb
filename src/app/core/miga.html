@if (migas().length > 1) {
  <nav class="max-w-[1400px] mx-auto px-4 pt-3" [attr.aria-label]="'app.miga' | transloco">
    <ol>
      @for (m of migas(); track $index; let ultimo = $last; let primero = $first) {
        <li>
          @if (!primero) { <mat-icon aria-hidden="true">chevron_right</mat-icon> }
          @if (ultimo) { <span aria-current="page">{{ m.texto }}</span> }
          @else { <a [routerLink]="m.ruta">{{ m.texto }}</a> }
        </li>
      }
    </ol>
  </nav>
}
