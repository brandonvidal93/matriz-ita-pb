# MySQL para desarrollo y pruebas:  docker compose up -d
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root-dev-local}
      MYSQL_DATABASE: matriz_ita
      MYSQL_USER: ita
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ita-dev-local}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci", "--default-time-zone=+00:00"]
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql-datos:/var/lib/mysql
      - ./api/docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 5s
      retries: 20
volumes:
  mysql-datos:
